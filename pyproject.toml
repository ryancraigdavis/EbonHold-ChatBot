[project]
name = "ebonhold-chatbot"
version = "0.1.0"
authors = [
    { name = "Ryan Davis", email = "ryancraigdavis@gmail.com" },
]
description = "EbonHold Chatbot LLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=24.1.0",
    "attrs>=25.3.0",
    "chromadb>=1.1.0",
    "discord-py>=2.6.3",
    "groq>=0.31.1",
    "PyNaCl>=1.5.0",
    "aiohttp>=3.8.0",
    "boto3>=1.34.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["hatchling"]

build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/ebonhold_chatbot"]

[tool.hatch.metadata]
allow-direct-references = true

[project.scripts]
ebonhold-bot = "ebonhold_chatbot.__main__:main"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
]
