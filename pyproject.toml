[project]
name = "ebonhold-chatbot"
version = "0.1.0"
authors = [
    { name = "Ryan Davis", email = "ryancraigdavis@gmail.com" },
]
description = "EbonHold Chatbot LLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=24.1.0",
    "attrs>=25.3.0",
    "chromadb>=1.1.0",
    "discord-py>=2.6.3",
    "groq>=0.31.1",
]

[build-system]
requires = ["hatchling"]

build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/ebonhold_chatbot"]

[tool.hatch.metadata]
allow-direct-references = true
