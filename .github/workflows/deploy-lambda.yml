name: Deploy Lambda Function with EFS

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'lambda/**'
      - 'infrastructure/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Install UV
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Configure AWS credentials
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_SERVICE_TOKEN }}
        run: |
          export AWS_ACCESS_KEY_ID=$(doppler secrets get AWS_ACCESS_KEY_ID --plain)
          export AWS_SECRET_ACCESS_KEY=$(doppler secrets get AWS_SECRET_ACCESS_KEY --plain)
          export AWS_REGION=$(doppler secrets get AWS_REGION --plain)
          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> $GITHUB_ENV
          echo "AWS_REGION=$AWS_REGION" >> $GITHUB_ENV

      - name: Install SAM CLI
        run: pip install aws-sam-cli

      - name: Build Lambda package with UV
        run: |
          echo "📦 Building Lambda package..."

          # Create package directory
          mkdir -p package

          # Install dependencies using UV
          uv pip install --python 3.12 --target package \
            chromadb \
            groq \
            PyNaCl \
            attrs \
            pyyaml \
            aiofiles

          # Copy source code
          cp -r src/ebonhold_chatbot package/
          cp lambda/handler.py package/

          # Copy data files (for structured search)
          mkdir -p package/ebonhold_chatbot/data
          cp -r src/ebonhold_chatbot/data/* package/ebonhold_chatbot/data/

          echo "✅ Lambda package built"

      - name: Get Doppler secrets for SAM
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_SERVICE_TOKEN }}
        run: |
          echo "EFS_FILE_SYSTEM_ID=$(doppler secrets get EFS_FILE_SYSTEM_ID --plain)" >> $GITHUB_ENV
          echo "EFS_ACCESS_POINT_ID=$(doppler secrets get EFS_ACCESS_POINT_ID --plain)" >> $GITHUB_ENV
          echo "VPC_ID=$(doppler secrets get VPC_ID --plain)" >> $GITHUB_ENV
          echo "SUBNET_ID_1=$(doppler secrets get SUBNET_ID_1 --plain)" >> $GITHUB_ENV
          echo "SUBNET_ID_2=$(doppler secrets get SUBNET_ID_2 --plain)" >> $GITHUB_ENV
          echo "SECURITY_GROUP_ID=$(doppler secrets get EFS_SECURITY_GROUP_ID --plain)" >> $GITHUB_ENV
          echo "DISCORD_TOKEN=$(doppler secrets get DISCORD_TOKEN --plain)" >> $GITHUB_ENV
          echo "DISCORD_PUBLIC_KEY=$(doppler secrets get DISCORD_PUBLIC_KEY --plain)" >> $GITHUB_ENV
          echo "GROQ_API_KEY=$(doppler secrets get GROQ_API_KEY --plain)" >> $GITHUB_ENV

      - name: Deploy with SAM
        run: |
          echo "🚀 Deploying to AWS Lambda..."

          cd infrastructure
          sam deploy \
            --template-file template.yaml \
            --stack-name ebonhold-discord-bot \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              EFSFileSystemId=$EFS_FILE_SYSTEM_ID \
              EFSAccessPointId=$EFS_ACCESS_POINT_ID \
              VpcId=$VPC_ID \
              SubnetId1=$SUBNET_ID_1 \
              SubnetId2=$SUBNET_ID_2 \
              SecurityGroupId=$SECURITY_GROUP_ID \
              DiscordToken=$DISCORD_TOKEN \
              DiscordPublicKey=$DISCORD_PUBLIC_KEY \
              GroqApiKey=$GROQ_API_KEY \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

          echo "✅ Deployment complete"

      - name: Get API Gateway URL
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name ebonhold-discord-bot \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiUrl`].OutputValue' \
            --output text)

          echo "🎉 Deployment successful!"
          echo ""
          echo "📊 API Gateway URL: $API_URL"
          echo ""
          echo "📋 Next steps:"
          echo "1. Go to Discord Developer Portal"
          echo "2. Set Interactions Endpoint URL to: $API_URL"
          echo "3. Test with /lich command in your Discord server"

      - name: Register Discord slash commands
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_SERVICE_TOKEN }}
        run: |
          echo "📝 Registering slash commands..."
          doppler run -- uv run python scripts/register_slash_commands.py
          echo "✅ Slash commands registered"